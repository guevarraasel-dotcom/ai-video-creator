
name: Build AI Video Creator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AI_Video_Creator_Phone_Build_Pack.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            ls -la
            exit 1
          fi
          unzip -t "$ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project
          unzip -o AI_Video_Creator_Phone_Build_Pack.zip -d android-project
          find android-project -maxdepth 6 -type f | head -200

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found in ZIP."
            find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "Gradle project root: $ROOT"
          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Clean Kotlin source files
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_root = Path("app/src")
          if not source_root.exists():
              raise SystemExit("ERROR: app/src was not found.")

          changed = 0
          for path in source_root.rglob("*.kt"):
              original = path.read_text(encoding="utf-8")
              lines = original.splitlines()
              cleaned_lines = [
                  line for line in lines
                  if line.strip() != "\\"
                  and not line.lstrip().startswith("```")
              ]
              cleaned = "\n".join(cleaned_lines) + "\n"
              if cleaned != original:
                  path.write_text(cleaned, encoding="utf-8")
                  print(f"Cleaned invalid lines: {path}")
                  changed += 1

          print(f"Kotlin files cleaned: {changed}")

          main_activity = Path(
              "app/src/main/java/com/aivideocreator/studio/MainActivity.kt"
          )
          if main_activity.exists():
              print("MainActivity.kt after cleanup:")
              for number, line in enumerate(
                  main_activity.read_text(encoding="utf-8").splitlines()[:20], 1
              ):
                  print(f"{number}: {line}")
          PY

      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/align-jvm.init.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate {
              tasks.matching {
                it.name.startsWith("compile") && it.name.endsWith("Kotlin")
              }.configureEach {
                kotlinOptions.jvmTarget = "1.8"
              }
            }
          }
          GRADLE

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -I "$RUNNER_TEMP/align-jvm.init.gradle" assembleDebug

      - name: Find APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-project -type f -path '*/build/outputs/apk/debug/*.apk' ! -name '*-androidTest*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was found."
            find android-project -type f -name '*.apk'
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-Video-Creator-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
