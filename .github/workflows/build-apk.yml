
      - name: Fix Java and Kotlin target
        run: |
          find project -type f -name "build.gradle" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +

name: Build AI Video Creator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -la
          test -f AI_Video_Creator_Phone_Build_Pack.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o AI_Video_Creator_Phone_Build_Pack.zip -d project

      - name: Find Gradle project
        run: |
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Hindi nakita ang settings.gradle sa ZIP file."
            exit 1
          fi

          echo "SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Creator-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
