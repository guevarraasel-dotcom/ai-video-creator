
name: Build AI Video Creator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build ZIP
        run: |
          set -e
          test -f AI_Video_Creator_Phone_Build_Pack.zip
          unzip -t AI_Video_Creator_Phone_Build_Pack.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          set -e
          mkdir -p android-project
          unzip -o AI_Video_Creator_Phone_Build_Pack.zip -d android-project
          find android-project -maxdepth 6 -type f | head -200

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          ROOT=""
          while IFS= read -r -d '' FILE; do
            ROOT="$(dirname "$FILE")"
            break
          done < <(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Walang settings.gradle sa ZIP."
            find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          echo "Project root: $ROOT"
          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"

      
      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/align-jvm.init.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                sourceCompatibility = JavaVersion.VERSION_1_8.toString()
                targetCompatibility = JavaVersion.VERSION_1_8.toString()
              }
              tasks.matching {
                it.name.toLowerCase().contains("kotlin")
              }.configureEach {
                it.kotlinOptions.jvmTarget = "1.8"
              }
            }
          }
          GRADLE

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: gradle --no-daemon -I "$RUNNER_TEMP/align-jvm.init.gradle" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Creator-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
