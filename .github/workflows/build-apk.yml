
name: Build AI Video Creator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build ZIP
        shell: bash
        run: |
          set -e
          if [ ! -f AI_Video_Creator_Phone_Build_Pack.zip ]; then
            echo "ERROR: Missing AI_Video_Creator_Phone_Build_Pack.zip"
            exit 1
          fi
          unzip -t AI_Video_Creator_Phone_Build_Pack.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p android-project
          unzip -o AI_Video_Creator_Phone_Build_Pack.zip -d android-project
          find android-project -maxdepth 6 -type f | head -200

      - name: Locate Gradle project
        id: gradle
        shell: bash
        run: |
          set -e
          ROOT=""

          while IFS= read -r -d '' FILE; do
            ROOT="$(dirname "$FILE")"
            break
          done < <(
            find "$GITHUB_WORKSPACE/android-project" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print0
          )

          if [ -z "$ROOT" ]; then
            echo "ERROR: No settings.gradle found in ZIP."
            find android-project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \
              -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          echo "Project root: $ROOT"
          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Clean Kotlin Markdown fences
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          while IFS= read -r -d '' FILE; do
            if grep -qE '^[[:space:]]*```' "$FILE"; then
              sed -i '/^[[:space:]]*```/d' "$FILE"
              echo "Cleaned Markdown fences: $FILE"
            fi
          done < <(find app/src -type f -name '*.kt' -print0)

          MAIN="app/src/main/java/com/aivideocreator/studio/MainActivity.kt"

          if [ -f "$MAIN" ]; then
            echo "MainActivity.kt first 20 lines:"
            sed -n '1,20p' "$MAIN"
          else
            echo "WARNING: MainActivity.kt not found at expected path."
            find app/src -type f -name '*MainActivity.kt'
          fi

      - name: Align Java and Kotlin JVM targets
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/align-jvm.init.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate {
              tasks.matching {
                it.name.startsWith("compile") &&
                it.name.endsWith("Kotlin")
              }.configureEach {
                kotlinOptions.jvmTarget = "1.8"
              }
            }
          }
          GRADLE

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            -I "$RUNNER_TEMP/align-jvm.init.gradle" \
            assembleDebug

      - name: Find APK
        id: apk
        if: success()
        shell: bash
        run: |
          set -e
          APK="$(find android-project -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            ! -name '*-androidTest*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AI-Video-Creator-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

